name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # No `secrets:` in this job, deliberately.
    #
    # The whole suite runs with LLM_PROVIDER=fake, so CI needs neither a
    # GEMINI_API_KEY nor Redis. If a test ever starts requiring the network this
    # job breaks — which is exactly the signal we want.
    env:
      LLM_PROVIDER: fake
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck (backend + console)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build (backend + console bundle)
        run: npm run build

      - name: Verify the committed console bundle is up to date
        # The bundle is committed so the reviewer needs no build step. If it
        # drifts from web/app.ts the delivered console would be stale — so this
        # is a CI failure, not a detail.
        run: git diff --exit-code -- public/app.js
