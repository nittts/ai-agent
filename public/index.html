<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Assistente RH/TI — console</title>
    <style>
      /* ===================================================================
         DESIGN INTENT
         This console is an INSTRUMENT, not a chat app. The conversation is
         the input; the EVIDENCE is the product. Requirements 4–7 of the
         challenge are all about proving what happened, so the panel leads.

         Every colour encodes a state. None is decorative.
         =================================================================== */
      :root {
        color-scheme: light dark;

        /* Surfaces — a cool paper, slightly blue-shifted, not the default cream */
        --surface: #fbfbfd;
        --surface-raised: #ffffff;
        --surface-sunken: #f2f3f7;
        --ink: #10131a;
        --ink-muted: #5b6472;
        --ink-faint: #8b94a3;
        --line: #e4e7ee;
        --line-strong: #d2d7e2;

        /* State colours — each means one thing */
        --accent: #1668a8; /* structure, citations, live state */
        --accent-soft: #e8f1f9;
        --ok: #17724a; /* cache HIT, healthy */
        --ok-soft: #e6f4ec;
        --warn: #96590a; /* degraded */
        --warn-soft: #fdf1de;
        --neutral: #5b6472; /* refusal — correct behaviour, no drama */

        --font-text:
          ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        --font-data:
          ui-monospace, 'SF Mono', 'JetBrains Mono', 'Cascadia Code', Menlo, Consolas, monospace;

        --radius: 10px;
        --radius-sm: 6px;
        --shadow-sm: 0 1px 2px rgb(16 19 26 / 0.05), 0 1px 1px rgb(16 19 26 / 0.03);
        --shadow-md: 0 4px 16px -4px rgb(16 19 26 / 0.1), 0 2px 6px -2px rgb(16 19 26 / 0.05);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --surface: #0d1014;
          --surface-raised: #151920;
          --surface-sunken: #10141a;
          --ink: #e8eaef;
          --ink-muted: #99a2b0;
          --ink-faint: #6b7583;
          --line: #232932;
          --line-strong: #333b47;

          --accent: #58b0e8;
          --accent-soft: #12293c;
          --ok: #5cbd8c;
          --ok-soft: #10261c;
          --warn: #dda94b;
          --warn-soft: #2b2113;
          --neutral: #99a2b0;

          --shadow-sm: 0 1px 2px rgb(0 0 0 / 0.4);
          --shadow-md: 0 4px 16px -4px rgb(0 0 0 / 0.5);
        }
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        background: var(--surface);
        color: var(--ink);
        font:
          15px/1.62 var(--font-text);
        /* Numbers must not jitter while the panel updates mid-stream. */
        font-variant-numeric: tabular-nums;
        -webkit-font-smoothing: antialiased;
      }

      .eyebrow {
        font: 600 10px/1 var(--font-data);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--ink-faint);
      }

      /* ---- top bar ------------------------------------------------------ */
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 20px;
        height: 56px;
        border-bottom: 1px solid var(--line);
        background: var(--surface-raised);
        flex-wrap: wrap;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 9px;
        margin-right: auto;
        font-weight: 640;
        font-size: 14.5px;
        letter-spacing: -0.011em;
      }
      .brand .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--ok);
        box-shadow: 0 0 0 3px var(--ok-soft);
      }
      .brand small {
        color: var(--ink-faint);
        font-weight: 400;
        font-size: 13px;
      }

      select,
      button,
      input {
        font: inherit;
        font-size: 13px;
        color: inherit;
        background: var(--surface-raised);
        border: 1px solid var(--line-strong);
        border-radius: var(--radius-sm);
        padding: 7px 10px;
        transition: border-color 120ms ease, box-shadow 120ms ease;
      }
      select {
        max-width: min(44vw, 400px);
      }
      button {
        cursor: pointer;
        font-weight: 550;
      }
      button:hover:not(:disabled),
      select:hover {
        border-color: var(--accent);
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }

      .switch {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-size: 12.5px;
        color: var(--ink-muted);
        cursor: pointer;
        user-select: none;
        padding: 6px 10px;
        border-radius: var(--radius-sm);
        border: 1px solid transparent;
      }
      .switch input {
        accent-color: var(--warn);
        width: 15px;
        height: 15px;
        padding: 0;
        margin: 0;
      }
      .switch[data-on='true'] {
        color: var(--warn);
        font-weight: 600;
        background: var(--warn-soft);
        border-color: color-mix(in srgb, var(--warn) 30%, transparent);
      }

      /* ---- stage --------------------------------------------------------- */
      .stage {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 356px;
        height: calc(100% - 56px);
      }
      @media (max-width: 900px) {
        .stage {
          grid-template-columns: 1fr;
          height: auto;
        }
      }

      .conversation {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }

      .transcript {
        flex: 1;
        overflow-y: auto;
        padding: 26px 28px;
        display: flex;
        flex-direction: column;
        gap: 26px;
        scroll-behavior: smooth;
      }

      .empty {
        margin: auto;
        max-width: 440px;
        text-align: center;
        color: var(--ink-muted);
        font-size: 14px;
      }
      .empty strong {
        display: block;
        color: var(--ink);
        font-size: 16px;
        font-weight: 620;
        margin-bottom: 7px;
        letter-spacing: -0.011em;
      }

      .turn-question {
        display: flex;
        gap: 11px;
        font-weight: 590;
        line-height: 1.5;
        letter-spacing: -0.005em;
      }
      .turn-question::before {
        content: '';
        flex: 0 0 3px;
        border-radius: 2px;
        background: var(--accent);
      }

      .turn-answer {
        white-space: pre-wrap;
        max-width: 70ch;
        animation: rise 260ms cubic-bezier(0.2, 0.8, 0.3, 1) both;
      }
      .turn-answer[data-refused='true'] {
        color: var(--neutral);
        border-left: 2px solid var(--line-strong);
        padding-left: 14px;
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(3px);
        }
      }

      /* Citation markers link the prose to the panel on the right. */
      .cite {
        display: inline-block;
        font: 600 10.5px/1 var(--font-data);
        color: var(--accent);
        background: var(--accent-soft);
        border-radius: 4px;
        padding: 2px 4px;
        vertical-align: 0.18em;
        margin: 0 1px;
      }

      .caret::after {
        content: '';
        display: inline-block;
        width: 2px;
        height: 1.05em;
        background: var(--accent);
        vertical-align: -0.18em;
        margin-left: 2px;
        animation: blink 1.05s steps(2, start) infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0;
        }
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-top: 11px;
        padding: 4px 9px;
        border-radius: 999px;
        background: var(--warn-soft);
        color: var(--warn);
        font: 600 10.5px/1.4 var(--font-data);
        letter-spacing: 0.045em;
        text-transform: uppercase;
      }
      .badge::before {
        content: '';
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: currentColor;
      }

      .composer {
        display: flex;
        gap: 10px;
        padding: 16px 28px 20px;
        border-top: 1px solid var(--line);
        background: var(--surface-raised);
      }
      .composer input {
        flex: 1;
        padding: 10px 13px;
      }
      .composer input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }
      .composer button {
        padding: 10px 18px;
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      .composer button:disabled {
        background: var(--line-strong);
        border-color: var(--line-strong);
      }

      /* ---- evidence panel ------------------------------------------------ */
      .evidence {
        background: var(--surface-sunken);
        border-left: 1px solid var(--line);
        padding: 20px 18px 28px;
        overflow-y: auto;
        font-family: var(--font-data);
        font-size: 12px;
      }
      @media (max-width: 900px) {
        .evidence {
          border-left: none;
          border-top: 1px solid var(--line);
        }
      }

      .evidence section + section {
        margin-top: 22px;
        padding-top: 18px;
        border-top: 1px solid var(--line);
      }
      .evidence h2 {
        margin: 0 0 12px;
      }

      /* Instrument-style readout: LABEL ......... VALUE */
      .readout {
        display: flex;
        align-items: baseline;
        gap: 7px;
        padding: 4px 0;
      }
      .readout dt {
        color: var(--ink-muted);
        white-space: nowrap;
      }
      .readout .leader {
        flex: 1;
        border-bottom: 1px dotted var(--line-strong);
        transform: translateY(-3px);
      }
      .readout dd {
        margin: 0;
        font-weight: 620;
        white-space: nowrap;
      }
      dl {
        margin: 0;
      }

      .pill {
        padding: 2px 7px;
        border-radius: 999px;
        font-size: 11px;
      }
      .v-ok {
        color: var(--ok);
        background: var(--ok-soft);
      }
      .v-warn {
        color: var(--warn);
        background: var(--warn-soft);
      }
      .v-neutral {
        color: var(--neutral);
      }
      .v-accent {
        color: var(--accent);
        background: var(--accent-soft);
      }

      /* ---- latency waterfall (signature element) ------------------------- */
      .waterfall {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .lane {
        display: grid;
        grid-template-columns: 74px 1fr 50px;
        align-items: center;
        gap: 9px;
        font-size: 11px;
      }
      .lane .name {
        color: var(--ink-muted);
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .track {
        height: 8px;
        background: color-mix(in srgb, var(--line-strong) 45%, transparent);
        border-radius: 3px;
        position: relative;
        overflow: hidden;
      }
      .bar {
        position: absolute;
        inset: 0 auto 0 0;
        background: var(--accent);
        border-radius: 3px;
        transform-origin: left;
        animation: grow 400ms cubic-bezier(0.2, 0.8, 0.3, 1) both;
      }
      /* Hatching marks nodes that ran in the SAME superstep, in parallel. */
      .bar[data-parallel='true'] {
        background: repeating-linear-gradient(
          -45deg,
          var(--accent) 0 3px,
          color-mix(in srgb, var(--accent) 40%, transparent) 3px 6px
        );
      }
      .lane .ms {
        text-align: right;
        font-weight: 620;
      }
      @keyframes grow {
        from {
          transform: scaleX(0);
        }
      }
      .waterfall-note {
        margin-top: 9px;
        font-size: 10.5px;
        line-height: 1.5;
        color: var(--ink-faint);
      }

      /* ---- sources -------------------------------------------------------- */
      .source {
        display: grid;
        grid-template-columns: 22px 1fr;
        gap: 9px;
        padding: 10px 0;
      }
      .source + .source {
        border-top: 1px dotted var(--line-strong);
      }
      .source .n {
        font-weight: 700;
        color: var(--accent);
        background: var(--accent-soft);
        border-radius: 4px;
        text-align: center;
        height: 18px;
        line-height: 18px;
        font-size: 10.5px;
      }
      .source .where {
        font-weight: 620;
        word-break: break-word;
        line-height: 1.45;
      }
      .source .detail {
        color: var(--ink-muted);
        font-size: 11px;
        margin-top: 3px;
        word-break: break-word;
      }
      .source .excerpt {
        color: var(--ink-muted);
        font: 11.5px/1.5 var(--font-text);
        margin-top: 6px;
        border-left: 2px solid var(--line-strong);
        padding-left: 9px;
        display: -webkit-box;
        -webkit-line-clamp: 4;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .warning {
        color: var(--warn);
        font-size: 11.5px;
        line-height: 1.55;
      }
      .placeholder {
        color: var(--ink-faint);
        font-size: 11.5px;
        line-height: 1.55;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
        .transcript {
          scroll-behavior: auto;
        }
      }
    </style>
  </head>

  <body>
    <header>
      <div class="brand">
        <span class="dot" aria-hidden="true"></span>
        Assistente RH/TI
        <small>· agente LangGraph</small>
      </div>

      <select id="presets" aria-label="Perguntas do roteiro">
        <option value="">Perguntas do roteiro…</option>
      </select>

      <label class="switch" id="chaos-label" data-on="false" hidden>
        <input type="checkbox" id="chaos" />
        Derrubar API de RH
      </label>
    </header>

    <main class="stage">
      <section class="conversation">
        <div class="transcript" id="transcript">
          <div class="empty" id="empty">
            <strong>Pergunte algo sobre RH ou TI</strong>
            Cada resposta mostra à direita de onde ela veio, quanto tempo levou em cada etapa
            e quanto custou.
          </div>
        </div>

        <form class="composer" id="form">
          <input
            id="input"
            placeholder="Ex.: tenho 18 dias de férias (id 1042), posso vender 10?"
            autocomplete="off"
            aria-label="Sua pergunta"
          />
          <button type="submit" id="send">Perguntar</button>
        </form>
      </section>

      <aside class="evidence" id="evidence">
        <section>
          <h2 class="eyebrow">Medição</h2>
          <dl id="measurements">
            <p class="placeholder">Aguardando a primeira pergunta.</p>
          </dl>
        </section>

        <section id="waterfall-section" hidden>
          <h2 class="eyebrow">Tempo por etapa do grafo</h2>
          <div class="waterfall" id="waterfall"></div>
          <p class="waterfall-note" id="waterfall-note"></p>
        </section>

        <section id="sources-section" hidden>
          <h2 class="eyebrow">Fontes consultadas</h2>
          <div id="sources"></div>
        </section>

        <section id="warnings-section" hidden>
          <h2 class="eyebrow">Avisos</h2>
          <div class="warning" id="warnings"></div>
        </section>
      </aside>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
